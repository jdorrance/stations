name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types, boundaries, tests and consumer fixtures
        run: pnpm verify
      - name: Bundle the Worker without deploying
        run: pnpm build:web && pnpm exec wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/worker-bundle"
